name: Public market data snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: public-market-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: ${{ vars.ENABLE_PUBLIC_MARKET_DATA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect CoinGecko public prices
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python -m wallex_research.public_market_data \
            --network --out-dir reports/public-market-data \
            coingecko-price --ids bitcoin,ethereum --vs usd
      - name: Collect Wallex markets only with explicitly configured contract
        env:
          WALLEX_API_BASE_URL: ${{ vars.WALLEX_API_BASE_URL }}
          WALLEX_MARKETS_PATH: ${{ vars.WALLEX_MARKETS_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "${WALLEX_API_BASE_URL:-}" || -z "${WALLEX_MARKETS_PATH:-}" ]]; then
            echo 'Wallex skipped: verified base URL/path are not configured.'
            exit 0
          fi
          PYTHONPATH=src:. python -m wallex_research.public_market_data \
            --network --out-dir reports/public-market-data wallex-markets
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-market-data-${{ github.run_id }}
          path: reports/public-market-data/*.json
          if-no-files-found: warn
          retention-days: 14
