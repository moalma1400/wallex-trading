name: Offline CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - arena/post-merge-ci

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: false

      - name: Install test dependency
        run: python -m pip install "pytest==9.1.1"

      - name: Validate source register
        run: python scripts/validate_sources.py

      - name: Validate local documentation links and citations
        run: python scripts/validate_doc_links.py

      - name: Compile Python source and tests
        run: python -m compileall -q src tests scripts

      - name: Run offline test suite
        env:
          PYTHONPATH: src:.
        run: python -m pytest -v

      - name: Check patch whitespace
        run: git diff --check
