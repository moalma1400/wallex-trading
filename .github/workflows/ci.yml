name: Offline CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - arena/post-merge-ci

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install "pytest==9.1.1"

      - name: Validate source register
        run: python scripts/validate_sources.py

      - name: Validate local documentation links and citations
        run: python scripts/validate_doc_links.py

      - name: Compile Python source and tests
        run: python -m compileall -q src tests scripts

      - name: Run offline test suite
        env:
          PYTHONPATH: src:.
        run: python -m pytest -v

      - name: Check changed lines for whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$PUSH_BEFORE_SHA" "$CURRENT_SHA"
          fi
