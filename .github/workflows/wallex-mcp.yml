name: Standalone Wallex MCP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallex-mcp-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-validate:
    name: Offline MCP validation (Python 3.12)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      # Deliberately no Wallex API key or account credentials.
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate source register
        run: python scripts/validate_sources.py
      - name: Validate local documentation links and citations
        run: python scripts/validate_doc_links.py
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts
      - name: Run offline test suite including MCP stdio smoke test
        run: python -m pytest -v
      - name: Check whitespace
        run: git diff --check
